# Loki 3.5.5 (monolítico) – almacén central de logs de seguridad del laboratorio (Fase 6).
# Un solo nodo, almacenamiento local, sin autenticación multi-tenant (tenant "fake"), solo en red interna/127.0.0.1.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 720h        # 30 días de retención en el laboratorio

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Motor de reglas: evalúa las reglas de correlación/alerta (LogQL) de deploy/hardened/siem/rules/
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  enable_api: true
  evaluation_interval: 15s

# Sin telemetría hacia terceros
analytics:
  reporting_enabled: false
