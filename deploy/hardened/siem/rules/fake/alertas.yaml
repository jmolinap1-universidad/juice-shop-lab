# Reglas de correlación y alerta del SIEM (Loki ruler, LogQL). Fase 6.
# Cada regla se asocia a un riesgo del registro (docs/fase-6/tratamiento-riesgo.md) y a OWASP Top 10:2025.
# Ventanas cortas (5 min) para el laboratorio; en producción se ajustarían umbrales y supresión.
groups:
  - name: juice-shop-seguridad
    interval: 15s
    rules:
      - alert: WAF_InyeccionSQL_Bloqueada
        expr: sum(count_over_time({entorno="local", job="waf_audit"} |= "\"ruleId\":\"942" [5m])) > 0
        labels: {severity: high, owasp: "A05:2025", riesgo: "R01,R02", fuente: waf}
        annotations:
          summary: "El WAF bloqueó intentos de inyección SQL (familia CRS 942xxx)"

      - alert: WAF_ParcheVirtual_Activado
        expr: sum(count_over_time({entorno="local", job="waf_audit"} |~ "\"ruleId\":\"10000[0-9]\"" [5m])) > 0
        labels: {severity: high, owasp: "A01/A02:2025", riesgo: "R07,R17", fuente: waf}
        annotations:
          summary: "Se activó un parche virtual propio (100001 asignación masiva / 100002 /metrics)"

      - alert: Login_FuerzaBruta_RateLimit
        expr: sum(count_over_time({entorno="local", job="waf_access", status="429"} [5m])) >= 3
        labels: {severity: medium, owasp: "A07:2025", riesgo: "R16", fuente: waf}
        annotations:
          summary: "Ráfaga de intentos de login frenada por limitación de tasa (HTTP 429)"

      - alert: Acceso_Rutas_Sensibles_Denegado
        expr: sum(count_over_time({entorno="local", job="waf_access", status="403"} | json | uri=~"/(ftp|encryptionkeys|metrics|support/logs).*" [5m])) > 0
        labels: {severity: medium, owasp: "A02:2025", riesgo: "R12,R17", fuente: waf}
        annotations:
          summary: "Intentos de acceso a rutas sensibles bloqueadas (listados, /metrics, claves)"

      # INDICADOR DE INVESTIGACIÓN, no prueba de BOLA: dos usuarios legítimos que leen SUS cestas también la activan
      # (falso positivo demostrado en evidence/fase-6/validacion-2026-11-10/04-falsos-positivos/ y en el cierre final).
      - alert: API_Enumeracion_Objetos_PosibleBOLA
        expr: count(sum by (uri) (count_over_time({entorno="local", job="waf_access", status="200"} | json | uri=~"/rest/basket/[0-9]+" [5m]))) >= 2
        labels: {severity: info, tipo: indicador-investigacion, owasp: "A01:2025 / API1:2023", riesgo: "R06", fuente: api-monitoring}
        annotations:
          summary: "Varias cestas distintas leídas en 5 min. Indicador de investigación (falsos positivos con varios usuarios legítimos); no confirma BOLA"

      # Señal de ALTA CONFIANZA (cierre Fase 6): con los parches 08 y 10 la app responde 403 cuando una cuenta pide un
      # objeto que no es suyo. El uso legítimo de la interfaz no produce estos 403 (recorrido-frontend: 35/35 sin 403).
      - alert: API_BOLA_AccesoAjenoDenegado
        expr: sum(count_over_time({entorno="local", job="waf_access", status="403"} | json | uri=~"/(rest/basket|api/BasketItems|api/Addresss|api/Cards|api/Feedbacks)/[0-9]+" [5m])) > 0
        labels: {severity: high, owasp: "A01:2025 / API1:2023", riesgo: "R06", fuente: api-monitoring}
        annotations:
          summary: "Intento de acceso a un objeto de otra cuenta denegado (403) en cestas, artículos, direcciones, tarjetas u opiniones"

      # Pérdida de ingesta (R19/R24): el latido del WAF (healthcheck cada 30 s, override corregido) deja de llegar a Loki.
      - alert: Ingesta_WAF_Ausente
        expr: absent_over_time({entorno="local", job="waf_access"}[2m])
        for: 1m
        labels: {severity: high, owasp: "A09:2025", riesgo: "R19,R24", fuente: siem}
        annotations:
          summary: "No llegan registros de acceso del WAF a Loki desde hace más de 2 min (WAF, Alloy o Loki caídos)"

      - alert: RASP_Ataque_Detectado
        expr: sum(count_over_time({entorno="local", job="docker", container="juice-hardened"} |~ "^Zen has (blocked|detected)" [5m])) > 0
        labels: {severity: critical, owasp: "A05:2025", riesgo: "R01,R02", fuente: rasp}
        annotations:
          summary: "El RASP (Aikido Zen) detectó o bloqueó un ataque dentro de la aplicación"

      - alert: App_Errores_5xx
        expr: sum(count_over_time({entorno="local", job="waf_access"} | json | status=~"5.." [5m])) > 5
        labels: {severity: medium, owasp: "A10:2025", riesgo: "R18", fuente: api-monitoring}
        annotations:
          summary: "Tasa anómala de errores 5xx (posibles condiciones excepcionales mal gestionadas)"

  # Cierre de brechas (2026-11-24): reglas PROPIAS de la nube (Render). Los eventos llegan con entorno="cloud" mediante el
  # colector de la API de Render (latencia medida ~48 s). Las reglas locales se acotaron a entorno="local": antes del
  # colector no había otra fuente, y sin el filtro las líneas de la nube habrían ocultado una caída de la ingesta local.
  - name: juice-shop-nube-render
    interval: 15s
    rules:
      - alert: Nube_WAF_InyeccionSQL_Bloqueada
        expr: sum(count_over_time({entorno="cloud", job="waf_audit"} |= "\"ruleId\":\"942" [5m])) > 0
        labels: {severity: high, entorno: cloud, owasp: "A05:2025", riesgo: "R01,R02,R21", fuente: waf-cloud}
        annotations:
          summary: "El WAF de Render bloqueó inyección SQL (CRS 942xxx)"

      - alert: Nube_Puerta_CredencialesFallidas
        expr: sum(count_over_time({entorno="cloud", job="waf_access", status="401"} | json | uri="/__acceso" [5m])) >= 5
        labels: {severity: medium, entorno: cloud, owasp: "A07:2025", riesgo: "R16,R21", fuente: puerta-cloud}
        annotations:
          summary: "5 o más credenciales erróneas en la puerta de acceso de la nube en 5 min"

      - alert: Nube_Puerta_FuerzaBruta_RateLimit
        expr: sum(count_over_time({entorno="cloud", job="waf_access", status="429"} [5m])) >= 3
        labels: {severity: high, entorno: cloud, owasp: "A07:2025", riesgo: "R16,R21", fuente: puerta-cloud}
        annotations:
          summary: "Ráfaga frenada por el límite de intentos en la nube (HTTP 429)"

      - alert: Nube_RASP_Ataque_Detectado
        expr: sum(count_over_time({entorno="cloud", job="docker"} |~ "Zen has (blocked|detected)" [5m])) > 0
        labels: {severity: critical, entorno: cloud, owasp: "A05:2025", riesgo: "R01,R02", fuente: rasp-cloud}
        annotations:
          summary: "El RASP del contenedor de Render detectó o bloqueó un ataque"

      - alert: Nube_Arranque_Fallido
        expr: sum(count_over_time({entorno="cloud", job="docker"} |~ "FALLO (app|clave JWT|acceso)" [10m])) > 0
        labels: {severity: high, entorno: cloud, owasp: "A05:2025", riesgo: "R21,R03", fuente: plataforma-cloud}
        annotations:
          summary: "El contenedor de Render informa un fallo de arranque (app, clave JWT o puerta)"

      # Salud del propio colector (sus logs locales los recoge Alloy): si la API de Render falla de forma sostenida, los
      # eventos cloud dejan de centralizarse aunque Render los conserve 7 días.
      - alert: Colector_Render_Fallando
        expr: sum(count_over_time({entorno="local", job="docker", container="siem-colector-render"} |= "ERROR" [10m])) >= 3
        labels: {severity: high, entorno: local, owasp: "A09:2025", riesgo: "R19", fuente: siem}
        annotations:
          summary: "El colector de Render acumula errores (clave, API o Loki): la centralización cloud está interrumpida"
