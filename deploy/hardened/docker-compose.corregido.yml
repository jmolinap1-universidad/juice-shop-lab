# Hito A / cierre de la Fase 6: defensa completa sobre la VARIANTE CORREGIDA (tercer archivo de Compose, junto a
# docker-compose.yml y docker-compose.ops.yml). Uso recomendado: `make ops-corregido-up` (ver Makefile).
#   docker compose -f docker-compose.yml -f docker-compose.ops.yml -f docker-compose.corregido.yml up -d
# - Sustituye la imagen oficial vulnerable por juice-corregida-rasp:local (construida con scripts/construir-corregida.sh).
# - Monta la clave JWT efímera como secreto; sin ella la aplicación NO arranca (fail-closed).
# - Proyecto, volúmenes y logs del WAF SEPARADOS del stack histórico (`make ops-up`, imagen oficial): antes del
#   cierre de la Fase 6 ambos compartían el proyecto juice-hardened, sus volúmenes sembrados y ./logs.
# - Los nombres de contenedor (juice-hardened, juice-waf, siem-*) se conservan porque el SIEM los usa: por eso
#   solo puede correr uno de los dos stacks a la vez (make ops-corregido-up lo comprueba).
name: juice-corregida-defensa

services:
  juice-shop:
    build:
      context: .
      dockerfile: Dockerfile.rasp
      args:
        BASE_IMAGE: juice-corregida:local
    image: juice-corregida-rasp:local
    environment:
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      # Cierre técnico: los retos de Juice Shop con disabledEnv quedan desactivados aunque no se detecte Docker
      # (en otra plataforma /.dockerenv puede no existir y reabrirían XXE o NoSQL). No depende de la detección.
      NODE_CONFIG: '{"challenges":{"safetyMode":"enabled"}}'
    secrets: [jwt_private_key]
    labels:
      siem.variante: "corregida"

  waf:
    environment:
      # Falso positivo hallado en el cierre de la Fase 6 (evidence/fase-6/cierre-final-2026-11-21/07-waf/): con la lista
      # por defecto del CRS (GET HEAD POST OPTIONS), la regla 911100 + 920350 bloqueaban (puntuación 8 ≥ 5) los PUT/DELETE
      # LEGÍTIMOS del propietario (cantidad y borrado de artículos de la cesta, direcciones, tarjetas). La autorización
      # de esos métodos la impone ahora el código (parche 10), no el WAF.
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PUT PATCH DELETE"
    # Latido del SIEM: /healthz tiene access_log off; este chequeo atraviesa WAF → app y deja una línea en el access log
    # cada 30 s. La regla Ingesta_WAF_Ausente avisa si deja de llegar a Loki (WAF, Alloy o Loki caídos).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -A siem-heartbeat -H 'Host: localhost' http://localhost:8080/rest/admin/application-version >/dev/null || exit 1"]
    volumes:
      - ./logs-corregido:/var/log/modsec:rw
      # Exclusiones acotadas de falsos positivos medidos (932260 en /rest/user/whoami)
      - ./waf/rules/98-exclusiones-fase6.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-998-EXCLUSIONES-FASE6.conf:ro
      # Exclusiones de reglas de fase 1 (antes del CRS): EX-2 socket.io (cierre de brechas 2026-11-24)
      - ./waf/rules/97-exclusiones-antes-crs.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    labels:
      siem.variante: "corregida"

  alloy:
    volumes:
      - ./logs-corregido:/var/log/waf:ro

  # Cierre técnico (2026-11-23): el ruler de Loki entrega las alertas a Alertmanager, que notifica a un receptor LOCAL.
  loki:
    command: ["-config.file=/etc/loki/loki.yaml", "-ruler.alertmanager-url=http://siem-alertmanager:9093"]

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    container_name: siem-alertmanager
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./siem/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    tmpfs:
      - /alertmanager:rw,nosuid,size=16m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
    networks: [siem]

  notificador:
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    container_name: siem-notificador
    command: ["python", "-I", "-u", "/app/notificador.py"]
    user: "65534:65534"
    volumes:
      - ./siem/notificador.py:/app/notificador.py:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    restart: unless-stopped
    networks: [siem]

  # Cierre de brechas (2026-11-24): eventos de Render → Loki local, automático y autenticado (API key de SOLO LECTURA que
  # crea el equipo en Render y guarda en ../corregido/secrets/render_api_key, ignorado por git). Perfil «nube»:
  #   docker compose ... --profile nube up -d colector-render      (sin la clave, no se arranca)
  # Loki NO se expone: el colector sale a https://api.render.com y escribe en Loki por la red interna del SIEM.
  # El volumen nombrado nace con propietario root y el colector corre como 65534: este paso único se lo entrega y termina
  # (hallado en el primer arranque real: PermissionError al guardar el cursor).
  colector-estado-init:
    profiles: ["nube"]
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    user: "0:0"
    command: ["chown", "65534:65534", "/estado"]
    volumes:
      - colector-estado:/estado
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]

  colector-render:
    profiles: ["nube"]
    depends_on:
      colector-estado-init:
        condition: service_completed_successfully
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    container_name: siem-colector-render
    command: ["python", "-I", "-u", "/app/colector-render.py"]
    user: "65534:65534"
    environment:
      RENDER_API_KEY_FILE: /run/secrets/render_api_key
      RENDER_OWNER_ID: tea-dc2huu97lnhs73ehia20          # workspace de Render (identificador, no secreto)
      RENDER_RESOURCE: srv-dc2i1buk1f9s7382sgmg          # servicio juice-lab-masi-staging
      RENDER_SERVICIO: juice-lab-masi-staging
      LOKI_URL: http://siem-loki:3100
      INTERVALO: "60"
      ESTADO: /estado/cursor.json
    secrets: [render_api_key]
    volumes:
      - ./siem/colector-render.py:/app/colector-render.py:ro
      - colector-estado:/estado
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    restart: unless-stopped
    networks: [siem]

volumes:
  colector-estado:

secrets:
  jwt_private_key:
    file: ../corregido/secrets/jwt_private_key.pem
  render_api_key:
    file: ../corregido/secrets/render_api_key
