# Hito A: defensa completa sobre la VARIANTE CORREGIDA (tercer archivo de Compose, junto a docker-compose.yml
# y docker-compose.ops.yml). Sustituye la imagen oficial vulnerable por juice-corregida:local + RASP y monta la
# clave JWT efímera como secreto. Uso:
#   docker compose -f docker-compose.yml -f docker-compose.ops.yml -f docker-compose.corregido.yml up -d --build
services:
  juice-shop:
    build:
      context: .
      dockerfile: Dockerfile.rasp
      args:
        BASE_IMAGE: juice-corregida:local
    image: juice-corregida-rasp:local
    environment:
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
    secrets: [jwt_private_key]

secrets:
  jwt_private_key:
    file: ../corregido/secrets/jwt_private_key.pem
