# Fase 6 – Capa de OPERACIONES y MONITOREO sobre el entorno endurecido (override de Compose).
# Uso:  docker compose -f docker-compose.yml -f docker-compose.ops.yml up -d --build
# Añade, sin modificar la configuración de la Fase 5:
#  - RASP in-process (Aikido Zen) en la aplicación  → detección/bloqueo en tiempo de ejecución
#  - SIEM ligero: Grafana Alloy (recolección) → Loki (almacén + reglas de correlación/alerta) → Grafana
# Aislamiento: solo se publican puertos en 127.0.0.1 (Grafana 3001, Loki 3100). Sin telemetría externa.
services:
  juice-shop:
    build:
      context: .
      dockerfile: Dockerfile.rasp
    image: juice-hardened-rasp:local
    environment:
      AIKIDO_BLOCK: "${AIKIDO_BLOCK:-true}"   # true = bloquear; false = solo detectar (monitoreo)
      AIKIDO_DEBUG: "true"                    # registra en stdout cada detección → SIEM
      # R22 (evidence/fase-6/rasp/ y evidence/fase-6/validacion-2026-11-11/): el bloqueo de Zen dentro de
      # Sequelize/sqlite3 dejaba la petición colgada y, por defecto, terminaba el proceso. La integración
      # rasp/rasp-guard.js lo convierte en error controlado HTTP 403 sin silenciar otros errores.
      # RASP_NODE_OPTIONS permite reproducir las configuraciones anteriores para las pruebas comparativas.
      NODE_OPTIONS: "${RASP_NODE_OPTIONS:---require @aikidosec/firewall --require /juice-shop/rasp/rasp-guard.js}"
    labels:
      siem.fuente: "app+rasp"

  waf:
    labels:
      siem.fuente: "waf"

  loki:
    image: grafana/loki:3.5.5@sha256:31628519045e7f28692a7ae73b4a3fd293dccb425585ed5d16ceea3b5c9592e6
    container_name: siem-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./siem/loki.yaml:/etc/loki/loki.yaml:ro
      - ./siem/rules:/etc/loki/rules:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    restart: unless-stopped
    networks: [siem]

  # Proxy del socket de Docker (R24). Montar docker.sock con ":ro" NO limita la API (permite crear/ejecutar
  # contenedores). El proxy solo expone lecturas de contenedores y eventos (POST=0, sin images/info/exec) en
  # una red interna sin salida y sin puertos publicados; Alloy ya no monta el socket ni corre como root.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1@sha256:3400c429c5f9e1b21d62130fb93b16e2e772d4fb7695bd52fc2b743800b9fe9e
    container_name: siem-socket-proxy
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      INFO: "0"
      IMAGES: "0"
      EXEC: "0"
      NETWORKS: "1"   # GET /networks: lo requiere discovery.docker de Alloy (solo lectura; POST=0)
      VOLUMES: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
    networks: [socketproxy]

  alloy:
    image: grafana/alloy:v1.10.2@sha256:bcf27f18c4402869af112fb39e35e1db3804a404686f4caa20bdf77814219223
    container_name: siem-alloy
    user: "473:473"   # usuario 'alloy' de la imagen: sin root y sin acceso directo al socket de Docker
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data",
              "--disable-reporting", "/etc/alloy/config.alloy"]
    volumes:
      - ./siem/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/waf:ro
      - alloy-state:/var/lib/alloy/data   # volumen nuevo: hereda el propietario 'alloy' de la imagen
    depends_on: [loki, socket-proxy]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped
    networks: [siem, socketproxy]

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    container_name: siem-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # solo lectura en 127.0.0.1 (laboratorio)
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/seguridad.json"
    volumes:
      - ./siem/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./siem/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [loki]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped
    networks: [siem]

networks:
  siem:
    driver: bridge
  socketproxy:
    driver: bridge
    internal: true   # sin salida: solo Alloy <-> proxy del socket

volumes:
  loki-data:
  alloy-state:
  grafana-data:
