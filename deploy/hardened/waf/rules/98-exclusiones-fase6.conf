# Exclusiones ACOTADAS del CRS para falsos positivos medidos en el cierre de la Fase 6 (stack vigente, override
# docker-compose.corregido.yml). Evidencia: evidence/fase-6/cierre-final-2026-11-21/07-waf/.
# Patrón recomendado por OWASP CRS: quitar UNA regla en UNA ruta concreta (ctl:ruleRemoveById), nunca desactivar
# familias completas ni bajar el umbral de anomalía. Se evalúan en fase 1, antes de las reglas de fase 2 afectadas.

# EX-1: /rest/user/whoami (la interfaz de Juice Shop la llama en cada página para conocer la sesión). La regla 932260
# (RCE: comando Unix directo) coincide con la palabra "whoami" del propio NOMBRE DE LA RUTA (REQUEST_FILENAME), no con
# datos del usuario. Con 920350 (Host numérico en el laboratorio) sumaba 8 ≥ 5 y bloqueaba la ruta para todos.
# Solo se excluye 932260 para esa ruta exacta y método GET: el resto de reglas (incluida 932260 en argumentos de
# cualquier otra ruta) sigue activo.
SecRule REQUEST_FILENAME "@streq /rest/user/whoami" \
  "id:100010,phase:1,pass,nolog,t:none,chain,\
   msg:'Exclusion acotada: 932260 en GET /rest/user/whoami (falso positivo por el nombre de la ruta)'"
    SecRule REQUEST_METHOD "@streq GET" "t:none,ctl:ruleRemoveById=932260"
