# Parches virtuales propios (after-crs). Mitigan fallos de lógica que el CRS genérico no cubre.
# Defensa en profundidad: el arreglo definitivo es el código (app-hardened), estos son compensatorios.

# VP-1 (A7 / CWE-915): impide el registro con rol privilegiado por asignación masiva.
# Bloquea cualquier POST a /api/Users que incluya el parámetro "role" en el cuerpo JSON.
# ModSecurity parsea el JSON a ARGS, por lo que se inspecciona ARGS_NAMES.
SecRule REQUEST_URI "@beginsWith /api/Users" \
  "id:100001,phase:2,deny,status:403,log,t:none,\
   msg:'Virtual patch: asignacion masiva de role en registro (A7/CWE-915)',\
   tag:'app-hardened',chain"
    SecRule REQUEST_METHOD "@streq POST" "chain"
      SecRule ARGS_NAMES "@rx (?i)role" "t:none,t:lowercase"

# VP-2 (A6 / CWE-200): defensa adicional para el endpoint de métricas Prometheus
# (además del bloqueo en nginx), por si se accede por otra ruta.
SecRule REQUEST_URI "@rx ^/metrics($|\?)" \
  "id:100002,phase:1,deny,status:403,log,t:none,\
   msg:'Virtual patch: /metrics expuesto (A6/CWE-200)',tag:'app-hardened'"
