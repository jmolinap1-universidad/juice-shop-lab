# Exclusiones ACOTADAS que deben evaluarse ANTES del CRS (se cargan como REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf,
# el lugar previsto por OWASP CRS). Necesario para reglas de FASE 1: desde REQUEST-998 (después del CRS) el ctl llega
# tarde. Hallado al verificar EX-2: con la exclusión en 98-exclusiones-fase6.conf el POST seguía en 403.

# EX-2 (cierre de brechas, 2026-11-24): /socket.io/ (canal en tiempo real de la interfaz: notificaciones de retos).
# Con el transporte «polling», el navegador envía los mensajes como POST con Content-Type text/plain, que el CRS no
# admite por defecto: la regla 920420 bloqueaba (403) cada envío y el navegador reintentaba sin fin (~1 petición/s
# observada en Render: evidence/cierre-brechas-2026-11-24/06-siem-render/). Las baterías por API no usaban socket.io.
# Solo se quita 920420 para POST a /socket.io/ con text/plain; el mismo tipo de contenido en cualquier otra ruta sigue
# bloqueado. Riesgo residual: el CRS no analiza como argumentos un cuerpo text/plain (igual que los marcos WebSocket,
# que ModSecurity tampoco inspecciona); los manejadores de socket.io de Juice Shop no consultan la base de datos.
SecRule REQUEST_FILENAME "@streq /socket.io/" \
  "id:100011,phase:1,pass,nolog,t:none,chain,\
   msg:'Exclusion acotada: 920420 en POST /socket.io/ con text/plain (transporte polling de socket.io)'"
    SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
        SecRule REQUEST_HEADERS:Content-Type "@beginsWith text/plain" "t:none,t:lowercase,ctl:ruleRemoveById=920420"
