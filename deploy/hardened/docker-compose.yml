# Despliegue ENDURECIDO del laboratorio (Fase 5 + 6). Solo en 127.0.0.1.
# Endurecimiento de runtime verificable con `docker inspect`:
#  - cap_drop ALL (sin capacidades de Linux)
#  - no-new-privileges (impide escalada por setuid)
#  - read_only root filesystem + tmpfs para las rutas que Juice Shop necesita escribir
#  - usuario no root (65532), pids_limit y límites de CPU/memoria (anti-DoS, T18)
#  - NODE_ENV=production (sin el modo 'unsafe' del laboratorio vulnerable)
#  - Nginx + ModSecurity + OWASP CRS como WAF delante de la app (se configura en la Fase 6)
name: juice-hardened
services:
  juice-shop:
    build:
      context: .
      dockerfile: Dockerfile
    image: juice-hardened:local
    container_name: juice-hardened
    environment:
      NODE_ENV: production
    user: "65532:0"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /juice-shop/logs:rw,nosuid,size=32m
    # Volúmenes nombrados: Docker los siembra desde la imagen y quedan escribibles, sin perder
    # los datos semilla (data/static, ftp, i18n, frontend/dist). El resto del FS es de solo lectura.
    volumes:
      - juice-data:/juice-shop/data
      - juice-ftp:/juice-shop/ftp
      - juice-wellknown:/juice-shop/.well-known
      - juice-dist:/juice-shop/frontend/dist
      - juice-i18n:/juice-shop/i18n
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    networks: [interna]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/rest/admin/application-version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  waf:
    image: owasp/modsecurity-crs:4.25.2-nginx-202610180210-lts
    container_name: juice-waf
    depends_on:
      juice-shop:
        condition: service_healthy
    environment:
      BACKEND: "http://juice-shop:3000"
      MODSEC_RULE_ENGINE: "On"           # bloqueo activo (DetectionOnly para solo registrar)
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      MODSEC_AUDIT_LOG: "/var/log/modsec/audit.log"
      MODSEC_AUDIT_LOG_FORMAT: "JSON"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      SERVER_TOKENS: "off"
    ports:
      - "127.0.0.1:${WAF_PORT:-8080}:8080"   # único punto de entrada; la app no se publica (WAF_PORT si 8080 está ocupado)
    volumes:
      - ./logs:/var/log/modsec:rw
      - ./waf/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./waf/rules/99-virtual-patches.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-999-VIRTUAL-PATCHES.conf:ro
    # El healthcheck de la imagen consulta https://localhost:8443/healthz, pero esta plantilla solo sirve HTTP en
    # 8080: el WAF quedaba "unhealthy" aunque funcionara (hallazgo de operación, Fase 6). Se comprueba por HTTP.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -A healthcheck http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [interna]

networks:
  interna:
    driver: bridge
    internal: false   # la app solo es alcanzable vía WAF; 'interna' aísla app<->waf

volumes:
  juice-data:
  juice-ftp:
  juice-wellknown:
  juice-dist:
  juice-i18n:
